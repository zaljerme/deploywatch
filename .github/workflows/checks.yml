name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deploywatch
          POSTGRES_PASSWORD: deploywatch
          POSTGRES_DB: deploywatch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U deploywatch"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://deploywatch:deploywatch@localhost:5432/deploywatch_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Verify migrations
        env:
          DATABASE_URL: postgresql+psycopg://deploywatch:deploywatch@localhost:5432/deploywatch_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
